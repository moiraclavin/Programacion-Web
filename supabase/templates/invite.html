<!doctype html>
<html lang="es">
  <body style="margin:0;padding:0;background:#faf8f5;font-family:Manrope,Helvetica,Arial,sans-serif;color:#2b2926;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#faf8f5;padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #e8e1d7;border-radius:14px;padding:40px 32px;">
            <tr>
              <td>
                <p style="margin:0 0 24px;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#6f6a63;">Casa Pilates</p>
                <h1 style="margin:0 0 16px;font-size:24px;font-weight:300;line-height:1.3;">Te damos la bienvenida</h1>
                <p style="margin:0 0 24px;font-size:16px;line-height:1.6;">
                  El estudio te creó una cuenta para que reserves tus clases, veas tus pagos y tu asistencia.
                  Para empezar, creá tu contraseña.
                </p>
                <p style="margin:0 0 32px;">
                  <a href="{{ .SiteURL }}/crear-contrasena?token_hash={{ .TokenHash }}&type=invite"
                     style="display:inline-block;background:#2b2926;color:#ffffff;text-decoration:none;padding:14px 28px;border-radius:999px;font-size:15px;font-weight:600;">
                    Crear mi contraseña
                  </a>
                </p>
                <p style="margin:0;font-size:13px;line-height:1.6;color:#6f6a63;">
                  Tu usuario es este email: {{ .Email }}.<br />
                  El link vence en 24 horas. Si no esperabas este mail, podés ignorarlo.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
